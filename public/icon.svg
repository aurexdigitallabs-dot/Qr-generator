<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background subtle dark indigo gradient -->
    <linearGradient id="qr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Vibrant primary indigo-violet gradient -->
    <linearGradient id="qr-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Cyan/Electric accent gradient -->
    <linearGradient id="qr-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft outer glow filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle / Rounded Backdrop -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#qr-bg)" stroke="#312e81" stroke-width="2.5" />

  <!-- Corner 1: Top-Left Finder Pattern -->
  <rect x="22" y="22" width="34" height="34" rx="9" fill="none" stroke="url(#qr-primary)" stroke-width="6.5"/>
  <rect x="32.5" y="32.5" width="13" height="13" rx="4" fill="url(#qr-accent)"/>

  <!-- Corner 2: Top-Right Finder Pattern -->
  <rect x="72" y="22" width="34" height="34" rx="9" fill="none" stroke="url(#qr-primary)" stroke-width="6.5"/>
  <rect x="82.5" y="32.5" width="13" height="13" rx="4" fill="url(#qr-accent)"/>

  <!-- Corner 3: Bottom-Left Finder Pattern -->
  <rect x="22" y="72" width="34" height="34" rx="9" fill="none" stroke="url(#qr-primary)" stroke-width="6.5"/>
  <rect x="32.5" y="82.5" width="13" height="13" rx="4" fill="url(#qr-accent)"/>

  <!-- Center Alignment & Timing Micro-Dots -->
  <circle cx="64" cy="39" r="4.5" fill="#818cf8"/>
  <circle cx="64" cy="64" r="6" fill="#38bdf8" filter="url(#soft-glow)"/>
  <circle cx="39" cy="64" r="4.5" fill="#818cf8"/>
  <circle cx="89" cy="64" r="4.5" fill="#818cf8"/>
  <circle cx="64" cy="89" r="4.5" fill="#818cf8"/>

  <!-- Bottom-Right Branded Matrix Cluster -->
  <rect x="73" y="73" width="12" height="12" rx="3.5" fill="url(#qr-primary)"/>
  <rect x="91" y="73" width="14" height="14" rx="4.5" fill="url(#qr-accent)"/>
  <rect x="73" y="91" width="14" height="14" rx="4.5" fill="url(#qr-accent)"/>
  <circle cx="98" cy="98" r="5" fill="#a5b4fc"/>

  <!-- Sparkle Accent in top-right corner dot -->
  <path d="M 64 21 Q 64 27 70 27 Q 64 27 64 33 Q 64 27 58 27 Q 64 27 64 21 Z" fill="#38bdf8" opacity="0.9"/>
</svg>
